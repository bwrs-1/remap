name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account ID
# Optional repository variable:
#   CLOUDFLARE_PAGES_PROJECT - Pages project name (default: matrix)
# The job is skipped until the secrets are set.
jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'matrix' }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set. Skipping deploy."
          fi
      - name: Checkout Repository
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Use Node.js 20.x
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Use Yarn v4
        if: steps.creds.outputs.ready == 'true'
        run: corepack enable; yarn set version 4.2.2
      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: yarn install --immutable
      - name: Build
        if: steps.creds.outputs.ready == 'true'
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGE_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGE_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_ERROR_REPORTING_KEY: ${{ secrets.REACT_APP_ERROR_REPORTING_KEY }}
          REACT_APP_PAYPAL_CLIENT_ID: ${{ secrets.REACT_APP_PAYPAL_CLIENT_ID }}
          REACT_APP_PAYPAL_ENVIRONMENT: ${{ secrets.REACT_APP_PAYPAL_ENVIRONMENT }}
        run: yarn build
      - name: Create Pages project if missing
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT_NAME" --production-branch main || true
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages deploy build --project-name "$PROJECT_NAME" --branch main
